<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랩틸몬스터 - CITES 파충류 전문팀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b1026;color:#fff;line-height:1.6}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:50;background:#0b1026;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid #c8ff00}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:44px;height:44px;background:#c8ff00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #ff6a00;flex-shrink:0}
.logo-t{font-size:20px;font-weight:900;white-space:nowrap;line-height:1}
.logo-s{font-size:10px;letter-spacing:2px;color:#c8ff00;font-weight:900;white-space:nowrap}
.hamburger{width:44px;height:44px;border-radius:50%;background:#fff;border:none;font-size:22px;cursor:pointer;flex-shrink:0}
.mobile-menu{display:none;background:#0b1026;padding:12px 16px 16px;border-bottom:3px solid #c8ff00}
.mobile-menu a{display:block;padding:13px;border-radius:12px;margin-bottom:8px;font-weight:800;text-align:center;background:#1a234a;color:#fff}
.mobile-menu a.yellow{background:#ffe600;color:#111;font-weight:900}
.hero{text-align:left;padding:28px 18px 30px;background:linear-gradient(180deg,#1a0b2e,#0b1026 55%,#ff6a00)}
.hero-badge{display:inline-block;background:#c8ff00;color:#111;font-weight:900;font-size:13px;padding:10px 16px;border-radius:999px;border:3px solid #111;box-shadow:4px 4px 0 #ff6a00;white-space:nowrap}
.hero h1{font-size:34px;line-height:1.2;margin:18px 0 12px;word-break:keep-all}
.hero h1 .white{color:#fff}
.hero h1 .yellow{color:#ffe600;text-shadow:3px 3px 0 #111}
.hero p{font-size:15px;opacity:.95;line-height:1.6;word-break:keep-all}
.hero-btns{margin-top:18px;display:flex;flex-direction:column;gap:10px;max-width:400px}
.btn-big{display:block;padding:16px;border-radius:999px;font-weight:900;font-size:18px;text-align:center;border:3px solid #111;box-shadow:4px 4px 0 #ff6a00;white-space:nowrap}
.btn-yellow{background:#ffe600;color:#111}
.btn-row{display:flex;gap:10px}
.btn-small{flex:1;padding:14px;border-radius:999px;font-weight:900;font-size:15px;text-align:center;border:3px solid #111;white-space:nowrap}
.btn-white{background:#fff;color:#111}
.btn-green{background:#c8ff00;color:#111}
.hero-checks{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.hero-checks span{background:#1a234a;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.marquee{overflow:hidden;background:#ffe600;color:#111;font-weight:900;padding:10px 0;white-space:nowrap}
.marquee span{display:inline-block;animation:marq 16s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
section{max-width:1000px;margin:0 auto;padding:42px 18px}
h2{font-size:26px;margin-bottom:6px}.sub{opacity:.8;font-size:14px;margin-bottom:18px;word-break:keep-all}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:42px}.hero-btns{max-width:520px}}
.card{background:#fff;color:#111;border-radius:18px;padding:18px;cursor:pointer;border:3px solid #111}
.card h3{font-size:17px;margin:6px 0}.card p{font-size:14px;opacity:.85}
.card .detail{display:none;margin-top:10px;background:#fff8b0;padding:10px;border-radius:10px;font-size:13px}
.card.open .detail{display:block}
.step{background:#161d3f;border:2px solid #2a356e;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.step b{background:#c8ff00;color:#111;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.chip{display:inline-block;background:#222;padding:9px 14px;border-radius:999px;margin:4px;cursor:pointer;font-weight:800;font-size:13px;white-space:nowrap}
.chip.active{background:#ffe600;color:#111}
.faq{background:#fff;color:#111;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.faq .a{display:none;margin-top:8px;font-size:14px}.faq.open .a{display:block}
.leader{background:#111;text-align:center;border:3px solid #ffe600;border-radius:22px;padding:30px 18px}
.leader h2{color:#ffe600;font-size:28px;word-break:keep-all}
.quiz{background:#fff;color:#111;border-radius:22px;padding:20px}
.level-btn{padding:10px 12px;border-radius:999px;border:2px solid #111;font-weight:900;cursor:pointer;background:#eee;margin:3px;font-size:13px
